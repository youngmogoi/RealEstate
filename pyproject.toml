[project]
name = "nc-land-intelligence"
version = "0.1.0"
description = "Weekly parcel scoring for Mecklenburg County, NC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas",
    "shapely",
    "rasterio",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "python-dotenv",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
