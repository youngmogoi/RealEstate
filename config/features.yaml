# Parcel features (features/build.py) and change detection (features/changes.py).
# DRAFT 2026-10-27: values marked (draft) await your confirmation.

streets:
  # Charlotte/Mecklenburg street centerlines from the city's map server (scriptable)
  url: https://gis.charlottenc.gov/arcgis/rest/services/CountyData/Streets/MapServer/0
  download_dir: data/raw/streets
  # Segments that give a lot no frontage
  exclude_lifecycle: ["Retired"]
  exclude_thoroughfare: ["EXFRY", "PROPFRY", "RAMP"]   # freeways and ramps: no driveway access
  private_class: ["PV"]                               # private streets count, reported separately
  # (draft) Proposed streets count (the city's status lags construction: 7 of 25 sampled
  # "landlocked" lots fronted one), reported as proposed_frontage_ft; a lot fronting only
  # proposed streets gets frontage_proposed_only.
  proposed_lifecycle: ["Proposed"]

frontage:
  # Boundary within this distance of a centerline is frontage. Lot lines sit 25-50 ft from
  # local centerlines (50-60 ft rights-of-way plus mapping offset); cul-de-sac bulbs and wide
  # arterials put them farther (53-68 ft in the 2026-10-27 landlocked sample). (draft)
  buffer_ft: 65                  # local streets
  buffer_major_ft: 90            # major thoroughfares (wider rights-of-way)
  major_thoroughfare: ["EXMJTH", "EXCOLLMJ", "EXMINTH", "EXMJTHC3C", "C2EX", "PROPMJTH", "PROPMINTH"]
  # (draft) Parcels with no frontage whose land use contains one of these reach the street through
  # HOA/common land: access_via_common_area instead of landlocked.
  common_access_land_uses: ["TOWN HOUSE", "TOWNHOUSE", "CONDO", "COMMON"]
  # A lot-line segment is frontage only if roughly parallel to the street: its two ends differ
  # in distance from the centerline by at most this share of its length (0.5 = within ~30 deg).
  # This keeps the first stretch of the side lot lines out of frontage.
  parallel_ratio: 0.5
  min_per_street_ft: 20          # (draft) a street counts as a frontage only above this length
  corner_max_gap_ft: 15          # (draft) two streets' frontages this close = corner; farther apart = through lot
  # (draft) Flag lot: 0 < frontage < flag_lot_max_frontage_ft AND frontage < this share of the lot's
  # width (narrow at the street, wide behind). The width test keeps ordinary narrow townhome
  # lots (median 22 ft frontage, 25 ft wide) out. Frontage 0 = landlocked.
  flag_lot_max_frontage_ft: 35
  flag_lot_max_frontage_to_width: 0.5

teardown:
  max_building_value_ratio: 0.20 # (draft) building / total value below this ...
  built_before: 1970             # (draft) ... and built before this year

owner_type_rules:
  # (draft) Checked in order; the first rule whose words match (as whole words, upper case) and
  # whose exclude phrases don't match decides. No match: individual. Entity suffixes come first,
  # so "123 S CHURCH ST LLC" and "10 WEST REAL ESTATE LLC" are companies, not a church or an estate.
  - type: llc_corporate
    words: ["LLC", "L L C", "LP", "LLP", "LTD", "CORP", "CORPORATION", "COMPANY", "CO"]
  - type: government
    words: ["CITY OF", "TOWN OF", "COUNTY", "STATE OF", "UNITED STATES", "USA", "NC DEPT", "DEPARTMENT OF",
            "BOARD OF EDUCATION", "AUTHORITY", "COMMISSION", "NCDOT"]
  - type: hoa
    # Homeowner and community associations (decided 2026-11-10). Before church_nonprofit, whose
    # ASSOCIATION / ASSN would catch them. Not "...ASSOCIATES" (companies) or civic associations.
    # Bare HOA is also a Vietnamese given name (NGUYEN HOA, LE BINH HOA: a 1925 plat was flagged), so
    # only "HOA INC" / "HOA I"; associations without INC are found by their common-area land use.
    words: ["HOMEOWNERS", "HOME OWNERS", "HOMEOWNER`S", "HOMEOWNERS`", "HOMEOWNRS", "HOA INC", "HOA I", "OWNERS ASSOCIATION",
            "OWNERS ASSOC", "OWNERS ASSN", "OWNER`S ASSOCIATION", "OWNERS` ASSOCIATION", "P/O ASSOC",
            "COMMUNITY ASSOCIATION", "COMMUNITY ASSOC", "COMMUNITY ASSN", "PROPERTY OWNERS", "MASTER ASSOCIATION",
            "MASTER ASSOC", "MASTER HOMEOWNER`S", "TOWNHOME ASSOCIATION", "TOWNHOMES ASSOCIATION", "TOWNHOME ASSOC",
            "MAINTENANCE ASSOCIATION", "RESIDENTIAL ASSOCIATION", "RESIDENTIAL ASSOC", "NEIGHBORHOOD ASSOCIATION",
            "NEIGHBORHOOD ASSOC", "VILLAS ASSOCIATION", "RESIDENTS ASSOCIATION"]
  - type: church_nonprofit
    words: ["CHURCH", "MINISTRIES", "MINISTRY", "TEMPLE", "MOSQUE", "SYNAGOGUE", "CONGREGATION", "DIOCESE",
            "BAPTIST", "METHODIST", "METH", "PRESBYTERIAN", "EPISCOPAL", "EPISC", "CATHOLIC", "LUTHERAN",
            "FOUNDATION", "ASSOCIATION", "ASSN", "SOCIETY", "LODGE", "CHARITY", "HABITAT"]
  - type: school
    # Private schools and colleges (decided 2026-11-09; e.g. PROVIDENCE DAY SCHOOL INC). After the
    # entity suffixes, so "OLD SCHOOL HOMES LLC" stays a company.
    words: ["SCHOOL", "ACADEMY", "COLLEGE", "UNIVERSITY", "SEMINARY"]
  - type: estate_heirs
    # The county rarely records estate status in names (~230 parcels labeled, 2026-10-27); most
    # inherited property stays under the decedent's plain name. Also checks the second owner
    # name, where "G R MAYES JR HEIRS" and similar appear.
    words: ["ESTATE", "EST", "EST OF", "LIFE EST", "LIFE ESTATE", "HEIRS", "HEIR", "DECEASED", "DECD", "DEC'D"]
    exclude: ["REAL ESTATE"]
    also_owner2: true
  - type: trust
    words: ["TRUST", "TRUSTEE", "TRUSTEES", "TR", "REVOCABLE", "IRREVOCABLE"]
  - type: llc_corporate
    words: ["INC", "PARTNERS", "PARTNERSHIP", "HOLDINGS", "PROPERTIES", "REALTY", "INVESTMENTS", "DEVELOPMENT",
            "BANK", "GROUP", "VENTURES", "ENTERPRISES", "HOMES", "BUILDERS"]

pieces:
  # Buildable pieces (features/pieces.py, decided 2026-10-28): each parcel's land outside the
  # vector unbuildable layers of config/constraints.yaml (stream and lake buffers, floodway,
  # encroachment area), split into separate pieces. Steep slope is measured per piece, not used
  # to split. A piece reaches a street when its lot line runs at least min_contact_ft inside a
  # usable street's frontage reach (streets/frontage settings above, any street, no parallel
  # test), or touches a same-owner neighbor (assemblage access) for at least min_contact_ft.
  # Yield (scoring/yield.py) counts a piece only if it meets the district minimum lot area.
  min_piece_sf: 500              # smaller fragments are mapping slivers, not stored (approved 2026-10-28)
  min_contact_ft: 20             # same as frontage min_per_street_ft (approved 2026-10-28)

changes:
  value_change_pct: 10           # (draft) total value change above this % is a change

weekly:
  log_dir: logs
  manual_max_age_days: 90        # warn when a hand-downloaded layer is older than this
  # Free space on the drive holding Docker's disk image (C:). A full disk corrupted Postgres once.
  disk_warn_free_gb: 5           # below this: warning at the top of the log + Windows notification
  disk_stop_free_gb: 2.5         # below this: skip the run (a run can grow the image by a few GB)
  docker_disk_image: '%LOCALAPPDATA%\Docker\wsl\disk\docker_data.vhdx'

hoa:
  # HOA detection (features/hoa.py, `make hoa`, decided 2026-11-10) -> parcel_hoa. HOA land = owner
  # type hoa, or one of these land uses (shell patterns). Every parcel on the same recorded plat
  # (legal description M<book>-<page>) as HOA land is likely_hoa; so is one touching HOA land with
  # the same NC OneMap subdivision name (the assessor's neighborhood, too broad to group by alone:
  # it would flag 62% of parcels, e.g. 937 E Woodlawn Rd with Sedgefield Park's HOA).
  common_land_uses: ["*COMMON*", "COS NO AV10"]
  ignore_subdivision_names: ["*SUBMARKET*"]     # assessor market buckets, not neighborhoods
  touch_ft: 1
  # plat_year = the year the first home on the plat was built (NC OneMap year built; no recording
  # dates in the county files), the same as the sewer proxy's
  pre_subdivision_year: 1980
