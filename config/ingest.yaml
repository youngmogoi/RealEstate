# Rules shared by every parcel ingest.

# Sale dates the county uses to mean "unknown"; stored as null.
placeholder_sale_dates: ["1900-01-01", "1975-01-01"]

# Flag parcels whose GIS acres and assessor/deeded acres differ by more than this fraction.
acres_mismatch_threshold: 0.20

# Mecklenburg County Open Mapping downloads (gis.mecknc.gov/data-center). Primary source.
# Re-download all three into the same folders before each weekly run.
county:
  boundaries: data/raw/ParcelBoundary/ParcelBoundary.gpkg      # "Tax Parcel Boundaries"
  owners: data/raw/OwnerInfo_Table/OwnerInfo_Table.csv         # "Tax Parcel Ownership Data"
  sales: data/raw/Parcel_Sales_Table/Parcel_Sales_Table.csv    # "Tax Parcel Sales"
  cama: data/raw/CAMA/Cama_Table/Cama_Table.csv                # "Tax Parcel CAMA Data" (CSV), `make cama`
  addresses: data/raw/MasterAddress/Master_Address_Table/Master_Address_Table.csv   # "Master Address - Active/Temporary Status" (CSV), `make addresses`

# Zoning (Mecklenburg County Open Mapping). Charlotte's layer covers the city and its planning
# area; the towns layer covers the six towns (plus a sliver of Stallings).
zoning:
  charlotte: data/raw/zoning/Zoning/Zoning.shp                  # "City of Charlotte Zoning"
  towns: data/raw/zoning/Tax/Tax.gpkg                           # "Unincorporated County & Towns Zoning"
  towns_layer: Zoning_County_Towns
  # County's own parcel-to-zoning list, used only to cross-check ("Parcels with zoning and zipcode")
  county_check: data/raw/zoning/ParcelZoningZipcode_Table/ParcelZoningZipcode_Table.csv
  # A parcel counts as split when a second district covers at least this share of it.
  # Smaller pieces are usually map misalignment along district edges.
  split_min_share: 0.05

# Sewer and water status (Mecklenburg). Charlotte Water does not publish its lines, so status is
# estimated from the sources below; see ingest/utilities.py.
utilities:
  # Source 1: Charlotte Water files under their security agreement. Never read without asking;
  # the ingest stops if anything is found here.
  restricted_dir: data/raw/utilities
  # Source 3: city capital projects, polygon view (has name, type, phase, years)
  cip_url: https://gis.charlottenc.gov/arcgis/rest/services/CIP/CapitalImprovementProjectsService/MapServer/23
  cip_download_dir: data/raw/cip
  cip_types: [Sewer, Water]
  cip_planned_phases: [Planning, Design, Design-Build, Procurement Services, Construction, Active, On Hold]
  planned_project_within_ft: 1000
  # A main within this distance makes a parcel "nearby" rather than "unserved" (used once
  # distances exist, i.e. sources 1 and 2)
  nearby_ft: 1000
  # Source 4 proxy: a parcel on a recorded plat whose first home was built after this year
  # counts as served (low confidence), for sewer and water.
  plat_after_year: 1980
  # Fallback for plats with no home in the year-built data yet (new subdivisions): served (low)
  # only if the plat book is recent, the parcel is inside a municipal limit, and the plat's
  # median lot is small. Books 20+ were >89% first built after 1980 (checked 2026-10-27);
  # books 90+ are an older numbering series. The newest book in Oct 2026 was 78, about 2-3 a
  # year: raise book_max before it reaches 89 (around 2029).
  plat_fallback:
    book_min: 20
    book_max: 89
    max_median_lot_acres: 0.5
    # County tax municipality values meaning "outside every town limit"
    outside_municipality: ["MECKLENBURG COUNTY-UNINCORPORATED", "na"]

# NC OneMap statewide parcels. Kept as history only; months behind the county for Mecklenburg.
nconemap:
  # The newest match (by Publication_Date in its metadata file) is loaded.
  source_glob: data/raw/mecklenburg-parcels-*/nc_mecklenburg_parcels_poly.shp

# Zoning ordinances (UDOs), official town/city sources only. Read by ingest/udo.py
# (`make udo`): downloads to data/raw/udo/<jurisdiction>/<date>/, appends to
# data/raw/udo/manifest.csv, and extracts sections and tables. `amended` is a regex whose
# first group is the latest amendment date printed in the document; `heading` matches a
# numbered section heading line (group 1 = number, group 2 = title).
policy_map:
  # Charlotte Future 2040 Policy Map (place types), from the city's ArcGIS Online layer behind
  # its official viewer (charlotte.maps.arcgis.com, web app 4dc02a1a85974085af7b36c33474efe0).
  url: https://services.arcgis.com/9Nl857LBlQVyzq54/arcgis/rest/services/Charlotte_Future_2040_Policy_Map/FeatureServer/0
  download_dir: data/raw/policy_map
  page_size: 2000                # the layer's maxRecordCount
  split_min_share: 0.05          # a second place type on >= 5% of a parcel marks it split (as zoning)
  # Expected short code for each full name; a shape whose code differs is flagged (the name is used)
  codes:
    Neighborhood 1: N1
    Neighborhood 2: N2
    Neighborhood Center: NC
    Community Activity Center: CAC
    Regional Activity Center: RAC
    Commercial: COMM
    Campus: CAMP
    Manufacturing & Logistics: ML
    Innovation Mixed-Use: IMU
    Parks & Preserves: PP

udo:
  out_dir: data/raw/udo
  # folder: each source's folder under out_dir. PDFs saved by hand directly in it (or in its
  # manual/ subfolder) are registered and extracted on the next run.
  sources:
    - jurisdiction: CHARLOTTE
      folder: CHARLOTTEUDO
      title: City of Charlotte Unified Development Ordinance
      kind: charlotte                     # current-version PDF + article web pages (cleaner tables)
      versions_url: https://charlotteudo.org/versions
      articles_url: https://charlotteudo.org/articles
      amended: 'Amended (\w+ \d{1,2}, \d{4})'
      heading: '^(\d{1,2}\.\d{1,2})\s+([A-Z][A-Z0-9 ,.:;&/''’()\-–]{2,90})$'
    - jurisdiction: CORNELIUS
      folder: CorneliusUDO
      title: Town of Cornelius Land Development Code
      kind: pdf
      url: https://cms2.revize.com/revize/cornelius/Land%20Development%20Code%202-16-2026.pdf
      page_url: https://cornelius.org/government/departments/planning_/land_development_code.php
      amended: '(?m)^\s*(\d{1,2}/\d{1,2}/\d{4})\s*$'   # each chapter's revision date, in page headers
      amended_latest: true
      heading: '^(\d{1,2}\.\d{1,2}(?:\.\d{1,2})?):\s+(.{3,90})$'
    - jurisdiction: DAVIDSON
      folder: DAVIDSONUDO
      title: Davidson Planning Ordinance (complete)
      kind: pdf
      url: https://www.townofdavidson.org/DocumentCenter/View/15595/_Complete-Davidson-Planning-Ordinance-20250225
      page_url: https://www.townofdavidson.org/1006/Planning-Ordinance
      amended: '(?m)^\s*(\d{2}\.\d{2}\.(?:20)?\d{2})\s*$'  # each section's revision date, in page headers
      amended_latest: true
      heading: '^(\d{1,2}\.\d{1,2}(?:\.\d{1,2}){0,2})\s+([A-Z].{2,90})$'
    - jurisdiction: PINEVILLE
      folder: PinevilleUDO
      title: Town of Pineville Zoning Ordinance
      kind: pdf
      url: https://www.pinevillenc.gov/wp-content/uploads/2026/03/Pineville-Zoning-Ordinance-2026.pdf
      page_url: https://www.pinevillenc.gov/government/departments/planning-zoning/
      amended: '(?:Updated|Adopted)\s+(\w+ \d{1,2}, \d{4})'
      heading: '^(\d{1,2}\.\d{1,2}(?:\.\d{1,2})?)\s+([A-Z].{2,90})$'
    # These sites answer 403 to scripts: download by hand into the folder.
    - jurisdiction: HUNTERSVILLE
      folder: HuntersvilleUDO
      title: Town of Huntersville Zoning Ordinance
      kind: manual
      page_url: https://huntersville.municipalcodeonline.com/book?type=zoning
      amended: 'Amended by Ord\.[^\n]{0,30}? on (\d{1,2}/\d{1,2}/\d{4})'   # section history notes
      amended_latest: true
      heading: '^(\d{1,2}\.\d{1,3}(?:\.\d{1,2})?)\s+([A-Z].{2,90})$'
    - jurisdiction: MATTHEWS
      folder: MatthewsUDO
      title: Town of Matthews Unified Development Ordinance
      kind: manual
      page_url: https://www.matthewsnc.gov/
      amended: 'Ord\. \d+, passed (\d{1,2}-\d{1,2}-\d{2,4})'   # section history notes
      amended_latest: true
      heading: '^(155\.\d{3}(?:\.\d{1,2})?)\.?\s+([A-Z].{2,90})$'
    - jurisdiction: MINT HILL
      folder: MintHillUDO
      title: Town of Mint Hill Unified Development Ordinance (Municode, Part III)
      kind: manual
      page_url: https://library.municode.com/nc/mint_hill/codes/code_of_ordinances?nodeId=PTIIIUNDEOR
      amended: 'Ord\. No\. \d+,\s*(\d{1,2}-\s?\d{1,2}-\d{4})'   # section history notes
      amended_latest: true
      heading: '^Section (\d{1,2}\.\d{1,2}(?:\.\d{1,2})?)\s*[-–—]\s*(.{2,90})$'
    - jurisdiction: STALLINGS
      folder: StallingsUDO
      title: Town of Stallings Development Ordinance
      kind: manual
      page_url: https://codelibrary.amlegal.com/codes/stallings/latest/overview
      amended: 'Last Amended (\w+ \d{1,2}, \d{4})'
      heading: '^(\d{1,2}\.\d{1,2}(?:-\d{1,2})?)(?:\s+([A-Z].{2,90}))?$'   # title often on the next line
