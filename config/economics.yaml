# Residual land value (Phase 2.3, scoring/rlv.py, `make rlv`). Created 2026-10-28.
# Values marked (draft) await your confirmation. Money is in dollars.
#
# Two models (decided 2026-10-28):
#   House model (lot as is, lot splits, townhomes):
#     RLV = buildings x (sale price - build cost - soft costs - target profit) - absorption discount
#           + ADU premium + retained house - demolition - site work - obligations
#   Lot model (subdivisions: standard, conservation, compact, mixed income, and their if_crossed):
#     RLV = lots x finished lot price - absorption discount - lots x development cost per lot
#           - demolition - site work - obligations
# Absorption discount and the project cap apply to subdivisions and townhomes ("projects").
#
# Blank (null) values: the three core costs are required; while any is blank, `make rlv` builds
# the comps and sales ratios and then stops without computing RLV. lot_to_home_ratio and
# duplex_discount set a price: while blank, the options that need them get no RLV. Every other
# blank is left OUT of the RLV it would apply to (never treated as 0 silently): that RLV is then
# an upper bound, flagged rlv_incomplete, with the missing names in blank_inputs.

costs:
  build_cost_per_sf: null        # $ per heated sf, hard construction cost (you fill in)
  soft_cost_pct: null            # % of build cost: design, permits, fees, financing, closing (confirmed 2026-10-28)
  target_profit_pct: null        # % of the sale price (confirmed 2026-10-28)
  demo_cost_per_sf: null         # $ per existing heated sf (CAMA), on every option that removes a building

site_work:
  sewer_per_ft: null             # $ per ft of sewer extension; used only where a sewer distance is known (none yet)
  road_per_ft: null              # $ per ft of the parcel's street frontage; options that create lots or townhomes
  stormwater_per_unit: null      # $ per unit; options that create lots or townhomes
  slope_per_acre: null           # $ per acre of 15-25% slope on the parcel; every option
  floodplain_per_unit: null      # $ per unit whose building falls in the 1% floodplain flag
  creek_crossing: null           # $ per parcel, added to the if_crossed options only (CLAUDE.md, buildable pieces)
  # Road and stormwater only on options that create lots or townhomes, not the lot as it is
  # (confirmed 2026-10-28).
  road_and_stormwater_on_lot_as_is: false

subdivision:
  # Finished lot price = this share of the median nearby new-home sale price (sfh comps).
  lot_to_home_ratio: null        # e.g. 0.25 (you fill in)
  # Per lot: internal streets, utilities, grading, entitlement. The site work items above (road
  # frontage, stormwater, slope, floodplain, crossing) are added separately; leave them out of this.
  development_cost_per_lot: null

project:
  # Subdivisions and townhomes sell over time: months = ceil(units / absorption); sales are spread
  # evenly and each month's revenue is discounted at the annual rate. House model: the margin is
  # discounted (costs come with each sale); lot model: lot revenue is (development is up front).
  absorption_homes_per_month: null
  annual_discount_rate_pct: null
  # Lots or units valued per project; larger yields are valued at the cap and flagged
  # over_project_cap. Blank = no cap.
  max_lots_per_project: null

plex:
  # Duplex, triplex and quadraplex units are priced from nearby townhome comps x this, flagged
  # comp_proxy, until the plex pool has min_real_sales within the widest radius (11 countywide in
  # Oct 2026). A unit is then the townhome comps' median heated sf; a building holds its units.
  duplex_discount: null          # e.g. 0.90 (you fill in)
  min_real_sales: 20

obligations:
  # Affordable units (quadraplex: 1 per building; voluntary mixed income: 50% of bonus lots, min 2)
  # sell at no more than this. Obligation = affordable units x (market home price - this), if > 0.
  affordable_max_price: null     # $ per unit at 80% AMI (you get this from Charlotte Housing)
  affordable_max_price_source: null
  affordable_max_price_year: null

adu_premium: null                # $ added to the main unit's price where an ADU is allowed (never a sale unit)

comps:
  # New-construction sales: arm's-length (blank validity code: no disqualification; blank has been
  # ~40% of sales every year since 2018), price > 0, not sold as vacant, one building on the
  # account, heated sf > 0, sold within window_months of the sales download, and
  # 0 <= sale year - year built <= max_age_years. Of several such sales of one account, the latest.
  window_months: 24
  max_age_years: 2
  radii_miles: [1, 2, 3]         # widen until min_comps
  min_comps: 5                   # fewer than this even at the widest radius = thin_comps
  # Sales outside this $/heated sf range are left out: lot sales recorded in the build year
  # (e.g. $110,000 on a 3,598 sf duplex) and mixed-use outliers. (draft)
  min_price_per_sf: 100
  max_price_per_sf: 2000
  # CAMA building type (largest building) for each comp product. Duplex, triplex and quadraplex
  # share one pool, "plex": CAMA can't tell them apart (resunits is 0 or blank on most).
  # Lot-size matching (decided 2026-10-28): single-family homes are priced from comps on lots of
  # a similar size. Band edges in sf of lot (the sold parcel's shape area); the last band is
  # open-ended. An option's homes use the band of its own lot (the lot as is, a split lot, or the
  # subdivision's lot). $/sf comes from the band's comps within the radii; where fewer than
  # min_comps, from all nearby single-family comps (lot_band_fallback), and the house size cap from
  # the band's countywide median. Townhomes (no lot of their own) and the plex proxy aren't banded.
  lot_bands_sf: [0, 5000, 8000, 12000, 20000, 43560]
  products:
    sfh: ["SINGLE FAMILY RESIDENTIAL"]
    townhome: ["TOWNHOUSE"]
    plex: ["DUPLEX-TRIPLEX-QUADRAPLEX"]

house_size:
  # House size = the median heated sf of the nearby comps for that product (decided 2026-10-28;
  # single-family: of the comps on similar lots),
  # capped by what zoning allows: footprint = the smaller of the setback envelope and max building
  # coverage x lot area, times floors = max height / story_height_ft, at most max_stories.
  story_height_ft: 12            # (confirmed 2026-10-28)
  max_stories: 3                 # (confirmed 2026-10-28)

sewer:
  # CLAUDE.md "Unknown sewer" (decided 2026-10-27). Cases, in order:
  #   known distance        -> sewer extension = distance x sewer_per_ft
  #   served (proxy, low)   -> assumed served
  #   unknown, in town      -> assumed served, flag verify_sewer
  #   unknown, outside town -> scored without public sewer (septic: single-family on large lots
  #                            only), with an "if sewer available" RLV reported beside it
  # sewer_assumed_new_units: the best use adds units or lots AND sewer is only assumed (decided
  # 2026-10-28). The digest shows it for shortlisted parcels only.
  septic_min_lot_sf: 43560       # placeholder (confirmed as such 2026-10-28; check with County Environmental Health)

price:
  # Price = asking price if listed (no listings source yet), else assessed value x sales ratio.
  # Sales ratio = median sale price / current assessed value (total value of the account), from
  # arm's-length sales in the last window_months, by municipality and land class (vacant =
  # building value 0, as parcel_features.vacant; CAMA's VAC flag sits on ~7,800 accounts with a
  # building, so it is not used). A sale counts only if the land class then and now agree
  # (sold as vacant = vacant now) and, for improved, no building is newer than the sale year.
  # Most specific group with at least min_sales: municipality + class, else countywide class,
  # else countywide.
  window_months: 24
  min_sales: 20

land_price:
  # Present-use value (decided 2026-10-28). Farm and forest land enrolled in NC present-use value
  # (CAMA exemption "AGRICULTURAL FLAG"; 542 parcels in Oct 2026) is taxed on a fraction of its
  # value, so assessed x ratio understates it. Its price = median vacant-land sale $ per acre for
  # its municipality and size band x its acres; fewer than min_sales -> countywide band. Vacant
  # land sales: arm's-length, sold as vacant, building value 0, one account on the parcel.
  puv_exemption: AGRICULTURAL FLAG
  window_months: 24
  min_sales: 20
  acre_bands: [0, 1, 5]          # under 1, 1-5, 5+ (5-20 had 32 sales and 20+ had 3 countywide)

rollback_tax:
  # Developing present-use land ends the deferral: the deferred taxes for the current year and
  # the 3 before it come due, with interest (G.S. 105-277.4(c)). Deferred value = CAMA market value
  # - taxable value, used for every year (an estimate). Interest per year i back (i = 0 current):
  # 0, else first_month_pct + monthly_pct x (12 i - 1). Charged on every option of an enrolled parcel.
  years: 4
  interest_first_month_pct: 2
  interest_monthly_pct: 0.75
  # Combined county + municipal rate, $ per $100 of value, by parcel municipality (you fill in)
  tax_rate_per_100:
    CHARLOTTE: null
    CORNELIUS: null
    DAVIDSON: null
    HUNTERSVILLE: null
    MATTHEWS: null
    MINT HILL: null
    PINEVILLE: null
    STALLINGS: null
    MECKLENBURG COUNTY-UNINCORPORATED: null

score:
  # Never scored or ranked (decided 2026-10-28; CLAUDE.md Phase 2.4): RLV is still computed and
  # stored, the score is left blank, excluded_reason names the category.
  exclude_owner_types:
    government: government
    church_nonprofit: church_nonprofit
  exclude_access_via_common_area: true       # HOA land reached only through common area
  # County land use (parcel_features.land_use), as shell patterns: * = anything.
  exclude_land_uses:
    golf_course: ["GOLF COURSE*"]            # not "SINGLE FAMILY RESIDENTIAL - GOLF" (homes on courses)
    club: ["CLUB, LODGES, UNION HALL, SWIM CLUB", "*COUNTRY CLUB*"]
    private_school: ["SCHOOL,COLLEGE, PRIVATE"]
    apartments: ["MULTI FAMILY", "MULTI FAMILY GARDEN", "MULTI FAMILY HIGH RISE", "MULTI FAMILY TOWNHOUSE",
                 "MULTI FAMILTY AFFORDABLE HOUSING"]   # sic; duplex/triplex stays in
    condominium: ["CONDOMINIUM", "CONDOMINIUM HIGH RISE"]
    cemetery: ["*CEMETERY*"]
    hoa_common_area: ["*COMMON*"]
    government: ["SCHOOL - PUBLIC", "RIGHT OF WAY", "AIR RIGHTS*"]
    utility: ["UTILITY*"]
    church_nonprofit: ["CHURCH"]
    healthcare: ["NURSING HOME", "HOME FOR THE AGED", "*HOSPITAL*", "*ASSISTED LIVING*"]
  # County Master Address Table (parcel_addresses, decided 2026-10-29). Addresses of model ASSET are
  # the county's "unoccupiable" ones (meters, signs, utility, cell towers ...). A parcel whose every
  # address is an ASSET and one of them is a utility use is a utility site: never scored. A utility
  # address next to real ones is only flagged (utility_address).
  utility_site_uses: ["UTILITY", "LIFT STATION"]
  utility_address_uses: ["UTILITY", "LIFT STATION", "CELL TOWER"]
  # Institutional address uses (Master Address txt_cdeuse; decided 2026-10-28). A parcel whose every
  # occupiable (non-ASSET) address has one of these uses is excluded under that category (the
  # first listed when several match); one beside a residential or other address is only flagged
  # (institutional_address). Use code 71 has no description in the file; its owners are churches
  # (661 of 893 named church/baptist/ministry...), so it is matched as "USE CODE 71".
  institutional_address_uses:
    club: ["CLUB-LODGE", "COUNTRY CLUB", "MARINA"]
    church_nonprofit: ["USE CODE 71", "ORPHANAGE"]
    private_school: ["SCHOOL:COLLEGE-PRIVATE", "DAY CARE"]
    healthcare: ["NURSING HOME", "HOSPITAL-PRIVATE", "PUBLIC HOSPITAL"]
    government: ["PUBLIC SCHOOL", "PUBLIC COLLEGE", "OTHER COUNTY", "OTHER FEDERAL", "OTHER MUNICIPAL",
                 "OTHER STATE", "MILITARY", "AIRPORT"]
    cemetery: ["MORTUARY-CEMETERY"]
    institutional_other: ["OTHER INSTITUTIONAL", "LAB/RESEARCH"]
    park_recreation: ["FOREST-PARK", "NATURE PRESERVE", "NATURE CENTER", "RECREATION CENTER", "POOL"]
  # Guard: address uses go stale (houses built on old church or institutional land keep the old use)
  # and home day cares are still houses. On a residential land use, an institutional-only parcel is
  # excluded only when its owner is an institution: owner type church_nonprofit or government, or
  # one of these whole words in the owner name. Otherwise it is flagged (institutional_address).
  institutional_guard:
    residential_land_uses: ["SINGLE FAMILY*", "TOWN HOUSE*", "TOWNHOUSE*", "RURAL HOMESITE", "USE VALUE HOMESITE",
                            "MOBILE HOME*", "RESIDENTIAL*", "MULTI FAMILY DUPLEX/TRIPLEX"]
    institution_owner_types: [church_nonprofit, government]
    institution_owner_words: ["CHURCH", "IGLESIA", "MINISTERIO", "PRAYER", "ASSEMBLY", "FELLOWSHIP", "WORSHIP",
                              "GOSPEL", "BIBLE", "CHAPEL", "TABERNACLE", "APOSTOLIC", "ISLAMIC", "MASJID",
                              "JEHOVAHS", "BAHA`IS", "SIKH", "HINDU", "BUDDHIST", "FRIENDS MEETING", "CLUB",
                              "SCHOOL", "ACADEMY", "SCHOLARS", "LEARNING", "CHILDREN", "KIDS", "COUNCIL",
                              "LIBRARY", "COMMISION", "CONSERVANCY"]
  # Flag existing_commercial_use (still scored) where one of these land uses sits on residential
  # zoning (every parcel with by-right housing yield).
  commercial_land_uses: ["COMMERCIAL*", "INDUSTRIAL*", "OFFICE*", "RETAIL*", "RESTAURANT*", "WAREHOUSE*",
                         "SERVICE*", "DAY CARE CENTER", "MINING"]
  # Excluded categories kept on a separate list (parcel_rlv.redevelopment_watch), from land use or
  # address use alike
  redevelopment_watch: [golf_course, club]
  top_n: 20
