# Partner buy boxes and routing thresholds (Phase 2.4, scoring/route.py, `make route`).
# Created 2026-10-28. Replace the test partner with real ones; one entry per partner.
#
# Fields (every partner):
#   name                     shown on the routing list
#   products                 any of: sfh, duplex, triplex, quadraplex, townhome, subdivision
#                            (subdivision = the sub_* options; sfh/duplex/... = the lot as is or splits)
#   counties                 county names, or [all]
#   areas                    municipalities (county tax municipality, e.g. Charlotte), or [all]
#   acres_min, acres_max     parcel gross acres (blank = no limit)
#   density_min, density_max units per gross acre of the option (blank = no limit)
#   sewer_required           true: parcels scored without public sewer (outside a town, unknown) don't match
#   max_land_price_per_unit  parcel price / the option's units (blank = no limit)
#   townhome_unit_width_ft   townhome partners: townhome yield and RLV are recomputed at this width
#   payment_structure        free text (e.g. assignment fee, takedown schedule), shown with the match

partners:
  - name: "TEST PARTNER - not real"
    products: [townhome]
    counties: [Mecklenburg]
    areas: [all]
    acres_min: 5
    acres_max: 30
    density_min: 6
    density_max: 
    sewer_required: true
    max_land_price_per_unit: 40000
    townhome_unit_width_ft: 22
    payment_structure: assignment fee

routing:
  # Every parcel here is in Mecklenburg (the only county loaded).
  parcel_county: Mecklenburg
  # Entitle candidate (rezoning) and crossing candidate (if the creek is crossed): the value must
  # beat the best by-right value by BOTH of these, and its score (value - price) must be > 0.
  # When the by-right value is 0 or negative, the % test passes. (defaults, decided 2026-10-28)
  entitle_min_uplift_pct: 25
  entitle_min_uplift_usd: 250000
  # Entitle only where the 2040 Policy Map place type is Neighborhood 2 or higher intensity
  # (decided 2026-10-28; not Neighborhood 1 -> N1-F). The rezoning yield uses the target district's
  # townhome rule (zoning_rules.yaml rezoning_targets); only Neighborhood 2 -> N2-A has a target
  # district so far, so the others yield no rezoning option until their districts get rules.
  entitle_place_types: [Neighborhood 2, Neighborhood Center, Community Activity Center,
                        Regional Activity Center, Innovation Mixed-Use]
  # Assessor discount (decided 2026-11-09): a parcel that would be Build, Route or a candidate but
  # whose assessed land $/sf is under min_ratio_pct of the median of nearby single-family lots
  # (within radius_ft, land value > 0, at least min_neighbors of them) goes to check_land instead:
  # the assessor usually knows of a basin, easement, creek or sliver. Your 2026-11-09 review: 4 of 5
  # bad picks were at 2-18%, the 5 good ones at 24-75%.
  assessor_discount:
    radius_ft: 500
    neighbor_land_uses: ["SINGLE FAMILY%"]   # SQL LIKE patterns on parcel_features.land_use
    min_neighbors: 5
    min_ratio_pct: 20                        # (draft)
  # More land checks (decided 2026-11-09), same hold (check_land) for parcels that would be acted on:
  # a mapped creek on a lot under creek_max_acres (a creek takes most of a small lot; bigger tracts
  # are handled by the buffers, pieces and creek_divides), or a transmission line mapped within
  # power_line_ft (the line layer is off by 100+ ft; 2734 Monroe Rd's is mapped 139 ft away). Your
  # verdicts in config/land_checks.yaml (ok / no) override every check.
  land_checks:
    creek_max_acres: 2                       # (draft)
    power_line_ft: 150                       # (draft)
