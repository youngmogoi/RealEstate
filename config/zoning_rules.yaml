            arterial_frontage: true                    # 15.4.GG.3.a
            through_lot_both_frontages_arterial: true  # 15.4.GG.3.b
            affordable_units: 1                        # at 80% AMI or less, 15 years (15.4.GG.3.a)
            affordable_ami_pct: 80
            affordable_years: 15
          design:
            - "Common wall at least 20 ft deep (15.4.GG.1)."
            - "Sidewalls perpendicular to the frontage (Table 4-6)."
          source: "UDO Table 15-1 (PC); 15.4.GG.1, 15.4.GG.3"
        townhome:
          allowed: no                # 'Dwelling - Multi-Family Attached Unit' (townhome = MF Attached, decided 2026-10-28)
          units_per_building: 0
          rezoning: {needs_rezoning: true, target: by_place_type}   # see rezoning_targets.CHARLOTTE.townhome
          source: "UDO Table 15-1 (Dwelling - Multi-Family Attached Unit, N1-C: not allowed)"
        adu:
          allowed: conditional       # Table 15-1: PC
          units_per_building: 1
          requires:
            accessory_to: [sfh, duplex]                # duplex only if its units are not on sublots
            per_lot: 1
            same_owner_as_principal: true
            max_heated_sf: 1000      # in an accessory building: greater of 600 sf or 70% of the principal home, never over 1,000
          design:
            - "No separate driveway unless corner, through or alley-loaded lot (15.6.F)."
          source: "UDO Table 15-1 (PC); 15.6.F"
        multi_dwelling_development:
          allowed: conditional       # Table 15-1: PC; several principal buildings on one lot
          requires:
            building_separation_ft: 10       # 15.4.HHH.2.a
            max_distance_to_street_ft: 400   # 15.4.HHH.2.b
          in_yield: false            # decided 2026-10-28: flag only, open question to city zoning staff (CLAUDE.md)
          flag: multi_dwelling_possible
          source: "UDO Table 15-1 (PC); 15.4.HHH"
      alternatives:
        conservation:
          source: "UDO 4.5.A"
          min_site_acres: 5
          max_lots: "gross site acres, excluding existing public street right-of-way, divided by 6,000 sf"
          lot_area_and_width_reduction_pct: 50
          setbacks: "side 5, corner side 10; front and rear may be cut 50%"
          conservation_area_pct: 40      # 30% green area + 10% common open space
          not_combined_with: [voluntary_mixed_income, compact]
        voluntary_mixed_income:
          source: "UDO 4.5.B"
          develop_as: N1-E
          min_site_acres: 1
          affordable: "50% of bonus lots at 80% AMI or less (15 years rental; city or nonprofit right of first refusal for sale); at least 2 affordable units"
          not_combined_with: [conservation, compact]
        compact:
          source: "UDO 4.5.C, Table 4-8"
          min_parcel_acres: 2            # one parcel of 2+ acres as of 2023-06-01, or an allowed assemblage
          assemblage: "allowed if one parcel fronts an arterial of 4+ lanes, or 3 or fewer parcels reach 2 acres"
          min_lot_sf: 3000
          min_lot_width_ft: 30
          setbacks_ft: {front: 5, corner_side: 5, side: 5, rear: 10}
          rear_alley_option: "rear 5 ft if all parking and garages are alley-loaded and the front setback grows 5 ft (Table 4-8 note 1)"
          max_building_coverage_pct: null   # Table 4-8 row G is blank
          common_open_space_pct: 10      # plus the base 15% green area (20.15.D)
          max_lots_fronting_open_space_pct: 30
          excluded: "airport 65 DNL contour; critical and protected watershed areas (Article 23)"
          not_combined_with: [conservation, voluntary_mixed_income]
    MX-2:
      status: draft
      housing: site_plan             # by-right yield = null; no district table applied
      flag: site_plan_governs
      petition: parcel_zoning.petition   # Charlotte zoning layer ZonePetiti; all 14,561 MX-2 parcels have one (2026-10)
      source: "UDO 1.4.C.1: a conditional district in place before 2023-06-01 follows its approved site plan and conditions, under the ordinances in effect at approval (vesting) or just before 2023-06-01 (vesting expired). The UDO has no MX-2 table; 20.9 lists MX-1/2/3 with the legacy (CD) districts."
      source_files: [CHARLOTTEUDO/2026-10-28/udo.pdf]
    MX-1:
      status: draft
      housing: site_plan             # by-right yield = null; no district table applied
      flag: site_plan_governs
      petition: parcel_zoning.petition   # Charlotte zoning layer ZonePetiti; all 12,868 MX-1 parcels have one (2026-10)
      source: "UDO 1.4.C.1: a conditional district in place before 2023-06-01 follows its approved site plan and conditions, under the ordinances in effect at approval (vesting) or just before 2023-06-01 (vesting expired). The UDO has no MX-1 table; 20.9 lists MX-1/2/3 with the legacy (CD) districts."
      source_files: [CHARLOTTEUDO/2026-10-28/udo.pdf]
    MX-3:
      status: draft
      housing: site_plan             # by-right yield = null; no district table applied
      flag: site_plan_governs
      petition: parcel_zoning.petition   # Charlotte zoning layer ZonePetiti; all 4,234 MX-3 parcels have one (2026-10)
      source: "UDO 1.4.C.1: a conditional district in place before 2023-06-01 follows its approved site plan and conditions, under the ordinances in effect at approval (vesting) or just before 2023-06-01 (vesting expired). The UDO has no MX-3 table; 20.9 lists MX-1/2/3 with the legacy (CD) districts."
      source_files: [CHARLOTTEUDO/2026-10-28/udo.pdf]
    N2-B:
      status: draft
      housing: by_right
      ordinance: Charlotte UDO, amended 2026-03-23
      source_files:
        - CHARLOTTEUDO/2026-10-28/udo.pdf
        - CHARLOTTEUDO/2026-10-28/articles/article-05.html   # Tables 5-1 to 5-8
        - CHARLOTTEUDO/2026-10-28/articles/article-15.html   # Table 15-1 use matrix
      # Lot area is per BUILDING, not per unit (Table 5-1 row A). Several buildings on one parcel
      # need the sum of their per-building minimums (note 2).
      min_lot_sf:
        value: 3000                  # per building: SF, duplex, triplex, quadraplex, MF attached
        multifamily_stacked: 12000   # per building
        per: building
        source: "UDO 5.3.B, Table 5-1 row A and note 2"
      min_lot_width_ft:
        value: null                  # Table 5-1 sets none for SF to quadraplex; they use N1-E (30 ft) per 5.1
        multifamily_attached: 50
        multifamily_stacked: 80
        multi_dwelling_development: 80
        source: "UDO 5.3.B, Table 5-1 row C"
      lot_standards_apply_to: {value: parent_parcel, source: "Table 5-1 note 1: lot standards apply to the parcel, not to individual sublots"}
      max_building_coverage_pct: {applies: per_lot, value: 60, source: "UDO 5.3.B, Table 5-1 row E"}
      max_height_ft:
        value: 48
        with_extra_setback: 65       # +1 ft per extra ft of side/rear setback (Table 5-3 note 3)
        source: "UDO 5.3.D, Table 5-3 row A, notes 2-4"
      setbacks_ft:
        # Front ("frontage setback line") depends on the street type in the Charlotte Streets Map and
        # is measured from the future back of curb (existing back of curb on local/collector streets).
        front: "NEEDS_REVIEW: 20 ft default; by street type below"
        front_by_street_type:
          uptown_signature: 24
          main_street: 24
          linear_park: 36
          avenue_boulevard_4_5_lane: 24
          avenue_boulevard_6_plus_lane: 30
          avenue_2_3_lane: 20
          transit_station_path_park: 10   # measured from the property or right-of-way line (note 3)
          uptown_primary: 20
          other_primary: 20
          secondary: 20
          parkway: 20                     # measured from ROW
          limited_access: 20              # measured from ROW
        corner_side: null            # every street frontage takes its own frontage setback line
        side: 5
        rear: 10
        rear_abutting_n1_place_type: 20
        source: "UDO 5.3.C, Table 5-2 rows A, D, E and notes 1, 3"
      flags:
        rear_setback_varies:
          when: "lot abuts a Neighborhood 1 place type (2040 Policy Map)"
          rule: "rear setback 20 ft instead of 10"
          source: "Table 5-2 row E"
        height_step_down:
          when: "within 200 ft of residential or vacant land in a Neighborhood 1 place type"
          rule: "50 ft max in the first 100 ft, 65 ft from 100 to 200 ft"
          source: "Table 5-3 note 2"
        large_site_dwelling_mix:
          when: "development site of 30 acres or more"
          rule: "a mix of dwelling types is required; no one type over 90% of the units"
          source: "UDO 15.4.HHH.4"
      density:
        max_upa: null                # no units-per-acre cap; per-building lot area and building length limit units
        source: "UDO 5.3, Table 5-1 (no density row)"
      open_space:
        multifamily_attached_sf_per_unit: 150          # private, common or public (5.4.A.3)
        stacked_or_multi_dwelling_pct_of_site: 10      # 5.4.A.1; MF attached in an MDD may use 150 sf/unit instead
        source: "UDO 5.4.A"
      types:
        sfh:
          allowed: conditional       # Table 15-1: PC
          units_per_building: 1
          requires: {develop_as: N1-E}   # N1-E lot and setback standards; height 48 ft (Table 5-3 note 4)
          source: "UDO Table 15-1 (PC); 15.4.HH.1; 5.1"
        duplex:
          allowed: conditional
          units_per_building: 2
          requires: {develop_as: N1-E}
          design: ["Common wall at least 20 ft deep (15.4.EE.1)."]
          source: "UDO Table 15-1 (PC); 15.4.EE.1, 15.4.EE.3; 5.1"
        triplex:
          allowed: conditional
          units_per_building: 3
          requires: {develop_as: N1-E}
          design: ["Common wall at least 20 ft deep (15.4.JJ.1)."]
          source: "UDO Table 15-1 (PC); 15.4.JJ.1, 15.4.JJ.3; 5.1"
        quadraplex:
          allowed: conditional       # no arterial or affordability condition outside N1 (15.4.GG.3 is N1 only)
          units_per_building: 4
          requires: {develop_as: N1-E}
          design: ["Common wall at least 20 ft deep (15.4.GG.1)."]
          source: "UDO Table 15-1 (PC); 15.4.GG.1, 15.4.GG.4; 5.1"
        townhome:
          allowed: conditional       # 'Dwelling - Multi-Family Attached Unit', Table 15-1: PC
          units_per_building: null   # building length / unit width; unit width is a product assumption, not zoning
          requires:
            min_lot_sf_per_building: 3000            # Table 5-1 row A
            min_lot_width_ft: 50                     # Table 5-1 row C
            max_building_length_ft: 150              # 15.4.FF.3
            max_building_length_rear_loaded_ft: 400  # garages entered from side or rear (15.4.FF.3; Table 5-4 row B)
            open_space_sf_per_unit: 150              # 5.4.A.3
          units_per_building_assumption: "NEEDS_REVIEW: unit width (ft) to turn building length into units, to live in config/ with costs and prices"
          design:
            - "Units share a straight, continuous common wall at least 20 ft deep (15.4.FF.1)."
          source: "UDO Table 15-1 (PC); 15.4.FF; Table 5-1; Table 5-4; 5.4.A.3"
        adu:
          allowed: conditional
          units_per_building: 1
          requires:
            accessory_to: [sfh, duplex]
            per_lot: 1
            same_owner_as_principal: true
            max_heated_sf: 1000
          source: "UDO Table 15-1 (PC); 15.6.F"
        multifamily_stacked:
          allowed: yes               # Table 15-1: X (apartments, condos)
          in_yield: "NEEDS_REVIEW: apartments need a massing model; flag only (apartments_possible)?"
          requires: {min_lot_sf_per_building: 12000, min_lot_width_ft: 80, open_space_pct_of_site: 10}
          source: "UDO Table 15-1 (X); Table 5-1; 5.4.A.1"
        multi_dwelling_development:
          allowed: conditional
          requires:
            building_separation_ft: 10
            max_distance_to_street_ft: 400
            min_lot_width_ft: 80
          lot_area: "sum of each building's minimum lot area (Table 5-1 note 2)"
          in_yield: false            # same unit count as separate building lots; flagged only
          flag: multi_dwelling_possible
          source: "UDO Table 15-1 (PC); 15.4.HHH; Table 5-1 note 2"
      alternatives: {}               # the 4.5 conservation, mixed-income and compact options are N1 only
